{% extends "base.html" %}{% block content %}
<h1>📝 Internal Marks</h1><div class="card"><table><tr><th>Subject</th><th>IA-1</th><th>IA-2</th><th>IA-3</th><th>Assignment</th><th>Total</th></tr>
{% for r in rows %}<tr><td>{{r.subject}}</td><td>{{r.ia1}}</td><td>{{r.ia2}}</td><td>{{r.ia3}}</td><td>{{r.assignment}}</td><td><b>{{r.ia1+r.ia2+r.ia3+r.assignment}}</b></td></tr>{% endfor %}</table></div>{% endblock %}
