
{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <section class="auth-form-card slide-in">
    <h1>Forgot Password?</h1>
    <p>Verify your registered email and create a new password.</p>

    <form id="resetForm" autocomplete="off">

      <label for="role">Account Type</label>
      <select name="role" id="role" required>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>

      <label id="identityLabel" for="identity">Student USN</label>
      <input
        type="text"
        name="identity"
        id="identity"
        placeholder="Enter your USN"
        required
      >

      <label for="email">Registered Email</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Enter registered email"
        required
      >

      <button type="button" id="sendOtp">Send OTP</button>

      <label for="otp">Email OTP</label>
      <input
        type="text"
        name="otp"
        id="otp"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        placeholder="Enter 6-digit OTP"
        required
        disabled
      >

      <button type="button" id="verifyOtp" disabled>
        Verify OTP
      </button>

      <label for="password">New Password</label>
      <input
        type="password"
        name="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Minimum 8 characters"
        required
        disabled
      >

      <label for="confirm_password">Confirm New Password</label>
      <input
        type="password"
        name="confirm_password"
        id="confirm_password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Re-enter new password"
        required
        disabled
      >

      <button class="auth-submit" type="submit" id="resetButton" disabled>
        Reset Password
      </button>

      <p id="status" role="status" aria-live="polite"></p>

      <a href="{{ url_for('student_login') }}">Student Login</a>
      |
      <a href="{{ url_for('faculty_login') }}">Admin Login</a>

    </form>
  </section>
</div>

<script>
(() => {
  const role = document.getElementById('role');
  const identity = document.getElementById('identity');
  const identityLabel = document.getElementById('identityLabel');
  const email = document.getElementById('email');
  const otp = document.getElementById('otp');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirm_password');
  const sendOtpButton = document.getElementById('sendOtp');
  const verifyOtpButton = document.getElementById('verifyOtp');
  const resetButton = document.getElementById('resetButton');
  const status = document.getElementById('status');
  const form = document.getElementById('resetForm');

  let verified = false;
  let otpSent = false;
  let requestInProgress = false;
  let verifiedAccount = null;

  function showMessage(message) {
    status.textContent = message;
  }

  function setPasswordEnabled(enabled) {
    password.disabled = !enabled;
    confirmPassword.disabled = !enabled;
    resetButton.disabled = !enabled;
  }

  function resetVerification() {
    verified = false;
    otpSent = false;
    verifiedAccount = null;

    otp.value = '';
    otp.disabled = true;
    verifyOtpButton.disabled = true;
    setPasswordEnabled(false);
  }

  role.addEventListener('change', () => {
    identityLabel.textContent =
      role.value === 'student' ? 'Student USN' : 'Admin Name';

    identity.placeholder =
      role.value === 'student'
        ? 'Enter your USN'
        : 'Enter your admin name';

    resetVerification();
    showMessage('');
  });

  async function postForm(url, data) {
    const response = await fetch(url, {
      method: 'POST',
      body: data,
      headers: {
        'X-Requested-With': 'XMLHttpRequest'
      }
    });

    let result;

    try {
      result = await response.json();
    } catch {
      throw new Error('Server returned an unexpected response.');
    }

    if (!response.ok && !result.message) {
      throw new Error('Request failed. Please try again.');
    }

    return result;
  }

  function accountDetailsChanged() {
    return !verifiedAccount ||
      verifiedAccount.role !== role.value ||
      verifiedAccount.identity !== identity.value.trim().toLowerCase() ||
      verifiedAccount.email !== email.value.trim().toLowerCase();
  }

  [identity, email].forEach(input => {
    input.addEventListener('input', () => {
      if (verified || otpSent) {
        resetVerification();
        showMessage('Account details changed. Request a new OTP.');
      }
    });
  });

  sendOtpButton.addEventListener('click', async () => {
    if (requestInProgress) return;

    if (!identity.value.trim() || !email.checkValidity()) {
      showMessage('Enter your account identity and a valid email.');
      return;
    }

    resetVerification();

    const data = new FormData();
    data.append('role', role.value);
    data.append('identity', identity.value.trim());
    data.append('email', email.value.trim().toLowerCase());

    requestInProgress = true;
    sendOtpButton.disabled = true;

    try {
      const result = await postForm(
        '{{ url_for("forgot_password_send_otp") }}',
        data
      );

      showMessage(result.message || 'OTP request completed.');

      if (result.ok) {
        otpSent = true;
        verifiedAccount = {
          role: role.value,
          identity: identity.value.trim().toLowerCase(),
          email: email.value.trim().toLowerCase()
        };

        otp.disabled = false;
        verifyOtpButton.disabled = false;
        otp.focus();
      }
    } catch (error) {
      showMessage(error.message || 'Could not send OTP. Try again.');
    } finally {
      requestInProgress = false;
      sendOtpButton.disabled = false;
    }
  });

  verifyOtpButton.addEventListener('click', async () => {
    if (requestInProgress) return;

    if (!otpSent) {
      showMessage('Send an OTP first.');
      return;
    }

    if (accountDetailsChanged()) {
      resetVerification();
      showMessage('Account details changed. Request a new OTP.');
      return;
    }

    if (!/^[0-9]{6}$/.test(otp.value.trim())) {
      showMessage('Enter the 6-digit OTP.');
      return;
    }

    const data = new FormData();
    data.append('email', email.value.trim().toLowerCase());
    data.append('otp', otp.value.trim());

    requestInProgress = true;
    verifyOtpButton.disabled = true;

    try {
      const result = await postForm(
        '{{ url_for("forgot_password_verify_otp") }}',
        data
      );

      verified = Boolean(result.ok);
      showMessage(result.message || 'Verification request completed.');

      if (verified) {
        setPasswordEnabled(true);
        password.focus();
      } else {
        setPasswordEnabled(false);
        verifyOtpButton.disabled = false;
      }
    } catch (error) {
      verified = false;
      setPasswordEnabled(false);
      verifyOtpButton.disabled = false;
      showMessage(error.message || 'Could not verify OTP.');
    } finally {
      requestInProgress = false;
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();

    if (requestInProgress) return;

    if (!verified || accountDetailsChanged()) {
      verified = false;
      setPasswordEnabled(false);
      showMessage('Verify your registered email before resetting.');
      return;
    }

    if (password.value.length < 8) {
      showMessage('Password must contain at least 8 characters.');
      return;
    }

    if (password.value !== confirmPassword.value) {
      showMessage('Passwords do not match.');
      confirmPassword.focus();
      return;
    }

    const data = new FormData();
    data.append('password', password.value);
    data.append('confirm_password', confirmPassword.value);

    requestInProgress = true;
    resetButton.disabled = true;

    try {
      const result = await postForm(
        '{{ url_for("forgot_password_reset") }}',
        data
      );

      showMessage(result.message || 'Password reset request completed.');

      if (result.ok) {
        form.reset();
        resetVerification();

        showMessage(
          'Password changed successfully. Please log in with your new password.'
        );
      } else {
        resetButton.disabled = false;
      }
    } catch (error) {
      resetButton.disabled = false;
      showMessage(error.message || 'Could not reset password. Try again.');
    } finally {
      requestInProgress = false;
    }
  });
})();
</script>

{% endblock %}
