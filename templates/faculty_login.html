{% extends "base.html" %}
{% block content %}

<div class="auth-page">
  <section class="auth-form-card slide-in">
    <div class="auth-symbol admin">A</div>
    <h1>Admin Login</h1>
    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>

    <form method="post">
      <label>Admin Name</label>
      <input
        type="text"
        name="name"
        autocomplete="username"
        placeholder="Enter admin name"
        required
      >

      <label>Select Semester</label>
      <select name="semester" required>
        <option value="">Select semester</option>
        {% for n in range(1, 9) %}
        <option value="{{ n }}">Semester {{ n }}</option>
        {% endfor %}
        <option value="ALL">ALL Semesters (1–8)</option>
      </select>

      <label>Admin Password</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input
          type="password"
          id="admin-password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
          style="flex:1;min-width:0;"
        >
        <button
          type="button"
          onclick="toggleAdminPassword()"
          id="admin-eye"
          aria-label="Show password"
        >👁</button>
      </div>

      <button class="auth-submit" type="submit">Login</button>
    </form>
  </section>
</div>

<script>
function toggleAdminPassword() {
  const password = document.getElementById('admin-password');
  const eye = document.getElementById('admin-eye');

  if (password.type === 'password') {
    password.type = 'text';
    eye.textContent = '🙈';
    eye.setAttribute('aria-label', 'Hide password');
  } else {
    password.type = 'password';
    eye.textContent = '👁';
    eye.setAttribute('aria-label', 'Show password');
  }
}
</script>

{% endblock %}
