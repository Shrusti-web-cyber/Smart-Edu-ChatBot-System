{% extends "base.html" %}{% block content %}<div class="login card"><div class="logo">✉️</div><h1>Email Verified by OTP</h1><p>Enter the 6-digit OTP sent to <b>{{email}}</b>.</p><form method="post"><label>Email OTP</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Enter 6-digit OTP" required autofocus><button>Verify Email & Create Account</button></form><p class="muted">The OTP expires after 10 minutes. The code is sent only to the email address entered during signup.</p></div>{% endblock %}
