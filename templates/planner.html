{% extends "base.html" %}{% block content %}<section class="hero"><div><h1>🗓️ Smart Study Planner</h1><p>{{student.name}} · {{student.college_name}}</p></div><a class="button" href="/dashboard">Dashboard</a></section><div class="card"><h2>Personal Timetable</h2><p class="muted">Add, edit or remove your own study blocks. This planner stays in your browser; your academic records remain protected on the server.</p><div id="planner"></div><button onclick="addBlock()">➕ Add Study Block</button></div><script>const key='smartedu_planner_{{student.id}}';let blocks=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(blocks));render()}function addBlock(){blocks.push({time:'6:00 PM',subject:'',task:'Revision'});save()}function render(){const el=document.getElementById('planner');el.innerHTML=blocks.map((b,i)=>`<div class="card" style="margin:10px 0"><div class="grid2"><input value="${b.time}" onchange="blocks[${i}].time=this.value;save()"><input value="${b.subject}" placeholder="Subject" onchange="blocks[${i}].subject=this.value;save()"><input value="${b.task}" placeholder="Task" onchange="blocks[${i}].task=this.value;save()"><button class="danger" onclick="blocks.splice(${i},1);save()">Delete</button></div></div>`).join('')||'<p class="muted">No study blocks yet.</p>'}render();</script>{% endblock %}
